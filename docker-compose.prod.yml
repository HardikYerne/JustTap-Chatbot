services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-this}
      JUSTTAP_KNOWLEDGE_DIR: /app/data/knowledge
      JUSTTAP_STATE_DIR: /app/data
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
